<style>
#rlink-dl *, #rlink-dl *::before, #rlink-dl *::after{box-sizing:border-box;margin:0;padding:0}

#rlink-dl #rl-dl{
  font-family: 'Syne', sans-serif;
  background: #ffffff;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  position: relative;
  padding: 96px 24px;
}
#rlink-dl #rl-dl::before, #rlink-dl #rl-dl::after{
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 120px;
  z-index: 3;
  pointer-events: none;
}
#rlink-dl #rl-dl::before{
  top: 0;
  background: linear-gradient(to bottom, #ffffff, transparent);
}
#rlink-dl #rl-dl::after{
  bottom: 0;
  background: linear-gradient(to top, #ffffff, transparent);
}

#rlink-dl /* ── BLOBS ── */
.blob-stage{
  position: absolute;
  inset: 0;
  pointer-events: none;
  z-index: 0;
  contain: paint;
}
#rlink-dl .blob{
  position: absolute;
  border-radius: 50%;
  transform: translateZ(0);
  filter: blur(70px);
  opacity:0.48;

}
#rlink-dl .blob-1{
  width: 480px; height: 480px;
  background: radial-gradient(circle, #c4b5fd, #7c3aed);
  top: -140px; right: -60px;
  animation: b1 16s ease-in-out infinite;
}
#rlink-dl .blob-2{
  width: 380px; height: 380px;
  background: radial-gradient(circle, #fbcfe8, #ec4899);
  bottom: -80px; left: -80px;
  animation: b2 13s ease-in-out infinite;
}
#rlink-dl .blob-3{
  width: 300px; height: 300px;
  background: radial-gradient(circle, #bfdbfe, #3b82f6);
  top: 40%; left: 10%;
  animation: b3 19s ease-in-out infinite;
}
#rlink-dl .blob-4{
  width: 240px; height: 240px;
  background: radial-gradient(circle, #6ee7b7, #10b981);
  top: 20%; right: 25%;
  animation: b4 11s ease-in-out infinite;
}
#rlink-dl .blob-5{
  width: 200px; height: 200px;
  background: radial-gradient(circle, #fed7aa, #f97316);
  bottom: 20%; right: 5%;
  animation: b5 15s ease-in-out infinite;
}

@keyframes b1 {
  0%,100%{transform:translate(0,0) scale(1);border-radius:60% 40% 70% 30%/50% 60% 40% 60%}
  33%{transform:translate(-60px,80px) scale(1.08);border-radius:40% 60% 30% 70%/60% 40% 60% 40%}
  66%{transform:translate(-20px,40px) scale(0.95);border-radius:70% 30% 50% 50%/40% 70% 30% 60%}
}
@keyframes b2 {
  0%,100%{transform:translate(0,0) scale(1);border-radius:50% 50% 40% 60%}
  40%{transform:translate(70px,-60px) scale(1.1);border-radius:30% 70% 60% 40%}
  70%{transform:translate(30px,-20px) scale(0.92);border-radius:60% 40% 50% 50%}
}
@keyframes b3 {
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(80px,-60px) scale(1.15)}
}
@keyframes b4 {
  0%,100%{transform:translate(0,0) scale(1) rotate(0deg)}
  50%{transform:translate(-50px,60px) scale(1.2) rotate(60deg)}
}
@keyframes b5 {
  0%,100%{transform:translate(0,0) scale(1)}
  50%{transform:translate(-60px,-80px) scale(1.1)}
}

#rlink-dl /* ── FROST ── */
.frost{
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0.60);
  z-index: 1;
  pointer-events: none;
}

#rlink-dl /* ── INNER ── */
.dl-inner{
  position: relative;
  z-index: 2;
  max-width: 680px;
  width: 100%;
  margin: 0 auto;
  text-align: center;
}

#rlink-dl /* ── HEADER ── */
.dl-eyebrow{
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  font-weight: 700;
  color: #7c3aed;
  letter-spacing: .14em;
  text-transform: uppercase;
  margin-bottom: 14px;
  animation: fadeUp .6s .1s ease both;
}

#rlink-dl .dl-title{
  font-size: clamp(32px, 6vw, 52px);
  font-weight: 800;
  letter-spacing: -2px;
  color: #0f0f0f;
  line-height: 1;
  margin-bottom: 12px;
  animation: fadeUp .6s .15s ease both;
}
#rlink-dl .dl-title .acc{ color: #7c3aed; }

#rlink-dl .dl-sub{
  font-family: 'Nunito', sans-serif;
  font-size: 15px;
  font-weight: 600;
  color: #6b7280;
  margin-bottom: 48px;
  animation: fadeUp .6s .2s ease both;
}
#rlink-dl .dl-ver-badge{
  display: inline-block;
  background: #f5f3ff;
  border: 1px solid #ede9fe;
  border-radius: 40px;
  padding: 2px 12px;
  font-weight: 800;
  color: #7c3aed;
  letter-spacing: .01em;
  margin-left: 4px;
}

@keyframes fadeUp {
  from{opacity:0;transform:translateY(16px)}
  to{opacity:1;transform:translateY(0)}
}

#rlink-dl /* ── CARDS ── */
.dl-grid{
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-bottom: 20px;
  animation: fadeUp .7s .25s ease both;
}

@media(max-width: 520px) {
  #rlink-dl .dl-grid{ grid-template-columns: 1fr; }
}

#rlink-dl .dl-card{
  background: rgba(255,255,255,0.72);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.9);
  border-radius: 20px;
  padding: 22px 22px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  transition: transform .22s, box-shadow .22s, background .2s;
  box-shadow: 0 2px 16px rgba(0,0,0,0.06);
  position: relative;
  overflow: hidden;
  text-align: left;
}

#rlink-dl .dl-card:not(.disabled):hover{
  transform: translateY(-4px);
  box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  background: rgba(255,255,255,0.88);
}

#rlink-dl .dl-card.disabled{
  opacity: 0.75;
  cursor: default;
  pointer-events: none;
  filter: grayscale(0.4);
}

#rlink-dl /* top accent line on hover */
.dl-card::before{
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: #7c3aed;
  transform: scaleX(0);
  transform-origin: left;
  transition: transform .3s;
}
#rlink-dl .dl-card:not(.disabled):hover::before{ transform: scaleX(1); }

#rlink-dl .dl-card-icon{
  width: 44px; height: 44px;
  border-radius: 12px;
  background: rgba(124,58,237,0.08);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s;
}
#rlink-dl .dl-card:not(.disabled):hover .dl-card-icon{
  background: rgba(124,58,237,0.14);
}
#rlink-dl .dl-card-icon svg{
  width: 22px; height: 22px;
  fill: #7c3aed;
}

#rlink-dl .dl-card-info{ flex: 1; min-width: 0; }

#rlink-dl .dl-card-name{
  font-size: 15px;
  font-weight: 700;
  color: #0f0f0f;
  letter-spacing: -.2px;
  line-height: 1.2;
  margin-bottom: 3px;
}

#rlink-dl .dl-card-spec{
  font-family: 'Nunito', sans-serif;
  font-size: 11.5px;
  font-weight: 600;
  color: #9ca3af;
}

#rlink-dl .dl-card-arrow{
  width: 28px; height: 28px;
  border-radius: 50%;
  background: rgba(124,58,237,0.08);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: background .2s, transform .2s;
}
#rlink-dl .dl-card:not(.disabled):hover .dl-card-arrow{
  background: #7c3aed;
  transform: translateY(2px);
}
#rlink-dl .dl-card-arrow svg{
  width: 13px; height: 13px;
  fill: #7c3aed;
  transition: fill .2s;
}
#rlink-dl .dl-card:not(.disabled):hover .dl-card-arrow svg{ fill: #fff; }

#rlink-dl .soon-badge{
  position: absolute;
  top: 12px; right: 12px;
  background: rgba(0,0,0,0.05);
  border-radius: 6px;
  padding: 3px 8px;
  font-family: 'Nunito', sans-serif;
  font-size: 10px;
  font-weight: 700;
  color: #9ca3af;
  letter-spacing: .06em;
  text-transform: uppercase;
}

#rlink-dl /* ── LATEST RELEASE BUTTON ── */
.dl-arm32{
  display: block;
  margin: 4px auto 14px;
  color: rgba(124,58,237,0.85) !important;
  font: 600 13px/1.4 'Nunito', sans-serif;
  text-decoration: none;
  text-align: center;
  opacity: 0.85;
}
.dl-arm32:hover{ text-decoration: underline; opacity: 1; }
.dl-latest{
  display: inline-flex !important;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.80) !important;
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border: 1.5px solid rgba(124,58,237,0.35) !important;
  border-radius: 40px;
  padding: 12px 26px;
  font-family: 'Nunito', sans-serif !important;
  font-size: 14px !important;
  font-weight: 700 !important;
  color: #7c3aed !important;
  text-decoration: none !important;
  transition: background .2s, transform .2s, box-shadow .2s;
  animation: fadeUp .6s .35s ease both;
  letter-spacing: .01em;
  cursor: pointer;
}
#rlink-dl .dl-latest:hover{
  background: rgba(255,255,255,0.97) !important;
  color: #5b21b6 !important;
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(124,58,237,0.15);
}
#rlink-dl .dl-latest svg{ width:15px;height:15px;fill:#7c3aed !important;flex-shrink:0 }
#rlink-dl .dl-latest *{ color: #7c3aed !important; }

#rlink-dl /* ── VERSION NOTE ── */
.dl-note{
  font-family: 'Nunito', sans-serif;
  font-size: 11px;
  font-weight: 600;
  color: #d1d5db;
  margin-top: 24px;
  letter-spacing: .03em;
  animation: fadeUp .6s .4s ease both;
}

@media (prefers-reduced-motion: reduce) {
  #rlink-dl .blob, #rlink-dl .bl{ animation: none !important; }
}

#rlink-dl /* Стили для иконки перехода (без черты, #rlink-dl стрелка вбок/вверх) */
.dl-card-web .dl-card-arrow svg{
  transform: rotate(45deg);
  transition: transform 0.2s, fill 0.2s;
}
#rlink-dl .dl-card-web:not(.disabled):hover .dl-card-arrow svg{
  transform: rotate(45deg) translate(1px, -1px);
}
#rlink-dl .dl-card-web .dl-card-arrow svg{
  fill: none;
  stroke: #7c3aed;
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
  width: 14px;
  height: 14px;
  transition: stroke 0.2s, transform 0.2s;
}
#rlink-dl .dl-card-web:not(.disabled):hover .dl-card-arrow svg{
  stroke: #ffffff;
}
#rlink-dl .dl-card-web .dl-card-arrow svg path{
  fill: none;
  stroke: inherit;
}
</style>

<!-- ═══ АКТУАЛЬНЫЕ ССЫЛКИ + ВЕРСИЯ (тянет манифест с нашего сервера) ═══ -->
<script>
(function () {
  var MANIFEST = 'https://185.244.172.90.nip.io/updates/manifest.json';
  function fname(u){ try { return decodeURIComponent(String(u).split('/').pop()); } catch(e){ return ''; } }
  fetch(MANIFEST, { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (m) {
      var v = m.version || '';
      var a = m.assets || {};
      document.querySelectorAll('[data-rl-ver]').forEach(function (el) { if (v) el.textContent = v; });
      ['android','macos','windows','linux'].forEach(function (p) {
        var url = a[p];
        document.querySelectorAll('[data-rl="' + p + '"]').forEach(function (el) {
          if (url) { el.setAttribute('href', url); el.classList.remove('disabled'); }
        });
        document.querySelectorAll('[data-rl-file="' + p + '"]').forEach(function (el) {
          if (url) el.textContent = fname(url);
        });
      });
      // Отдельный APK под старые 32-битные телефоны — ссылку показываем, только
      // если сервер её отдаёт (основная кнопка Android = arm64, 64-бит).
      var url32 = a.android_arm32;
      document.querySelectorAll('[data-rl="android_arm32"]').forEach(function (el) {
        if (url32) { el.setAttribute('href', url32); el.style.display = ''; }
      });
    })
    .catch(function () { /* манифест недоступен — остаются ссылки на страницу последнего релиза GitHub */ });
})();
</script>
