name: My Local Config
version: 1.0.0
schema: v1

# Настройка локальных моделей
models:
  # Основная модель для чата
  - name: Qwen 2.5 Coder 7B
    provider: ollama
    model: qwen2.5-coder:7b
    apiBase: http://localhost:11434

  # Модель для автодополнения (Tab)
  - name: Autocomplete
    provider: ollama
    model: qwen2.5-coder:1.5b
    apiBase: http://localhost:11434
    role: autocomplete

# Провайдер для поиска по коду (индексация)
embeddingsProvider:
  provider: ollama
  model: qwen2.5-coder:1.5b

# Настройка инструментов контекста (@code, @folder)
contextProviders:
  - name: code
    capabilities:
      - search
      - navigate
      - save
      - load
  - name: folder
    capabilities:
      - browse
      - manage
  - name: terminal
    capabilities:
      - execute
      - interact
  - name: diff
    capabilities:
      - compare
      - synchronize

# Настройка сохранения структуры проекта
projectStructure:
  enabled: true
  path: ./projects
  versionControl:
    type: git
    repository: https://github.com/MihailKashintsev/Rlink