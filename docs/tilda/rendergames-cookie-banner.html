<!--
  Баннер уведомления о cookie для rendergames.ru.

  Зачем: сайт ставит cookie (защита от DDoS + статистика Tilda). Согласие на
  нерекламные технические cookie не требуется, но уведомление о применении
  cookie и ссылка на политику — это то, что проверяют в первую очередь.

  Как использовать:
  1. Tilda → Настройки сайта → Ещё → HTML-код для вставки внутрь HEAD
     (или блок T123 в футере, который есть на ВСЕХ страницах).
  2. Убедитесь, что страница политики опубликована по адресу /privacy
     (или поправьте ссылку ниже).

  Выбор посетителя сохраняется в localStorage и баннер больше не появляется.
-->
<div id="rg-cookie" class="rg-cookie" hidden>
  <div class="rg-cookie-text">
    Мы используем файлы cookie: технические — для работы и защиты сайта,
    статистические — чтобы считать посещения в обезличенном виде.
    Подробнее в <a href="/privacy">Политике конфиденциальности</a>.
  </div>
  <div class="rg-cookie-actions">
    <button type="button" id="rg-cookie-ok" class="rg-cookie-btn rg-cookie-primary">
      Принять
    </button>
    <button type="button" id="rg-cookie-min" class="rg-cookie-btn">
      Только необходимые
    </button>
  </div>
</div>

<style>
  .rg-cookie {
    /* Нижнее меню сайта живёт на z-index 2147483647 (максимум), поэтому
       баннеру нужен такой же — при равенстве побеждает тот, кто ПОЗЖЕ в DOM,
       поэтому скрипт ниже переносит баннер в конец <body>. */
    position: fixed; left: 12px; right: 12px; bottom: 16px;
    z-index: 2147483647;
    max-width: 760px; margin: 0 auto;
    display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
    padding: 14px 16px; border-radius: 16px;
    background: rgba(16, 16, 24, .96);
    border: 1px solid #2a2a38;
    box-shadow: 0 10px 30px rgba(0, 0, 0, .45);
    color: #f0f0f4; font-size: 13px; line-height: 1.5;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    backdrop-filter: blur(8px);
  }
  .rg-cookie[hidden] { display: none; }
  .rg-cookie-text { flex: 1 1 320px; }
  .rg-cookie-text a { color: #7C3AED; }
  .rg-cookie-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .rg-cookie-btn {
    border: 1px solid #3a3a4a; background: transparent; color: #f0f0f4;
    border-radius: 10px; padding: 9px 16px; font-size: 13px; font-weight: 600;
    cursor: pointer; white-space: nowrap;
  }
  .rg-cookie-primary { background: #7C3AED; border-color: #7C3AED; color: #fff; }
  @media (max-width: 520px) {
    .rg-cookie { font-size: 12px; }
    .rg-cookie-btn { flex: 1 1 auto; }
  }
</style>

<script>
  (function () {
    var KEY = 'rg_cookie_consent_v1';
    var el = document.getElementById('rg-cookie');
    if (!el) return;
    var saved = null;
    try { saved = localStorage.getItem(KEY); } catch (e) {}
    if (saved) return;              // уже отвечал — не показываем

    // Перекрываем плавающее меню сайта: одинаковый z-index решается порядком
    // в DOM, поэтому баннер должен идти последним.
    function toTop() {
      if (el.parentNode !== document.body ||
          document.body.lastElementChild !== el) {
        document.body.appendChild(el);
      }
    }
    toTop();
    // Tilda дорисовывает меню после загрузки — повторяем после готовности.
    window.addEventListener('load', toTop);
    setTimeout(toTop, 1200);

    el.hidden = false;

    function decide(value) {
      try { localStorage.setItem(KEY, value); } catch (e) {}
      el.hidden = true;
      // Если позже подключите Метрику/рекламные скрипты — запускайте их
      // здесь только при value === 'all'.
    }
    document.getElementById('rg-cookie-ok')
      .addEventListener('click', function () { decide('all'); });
    document.getElementById('rg-cookie-min')
      .addEventListener('click', function () { decide('necessary'); });
  })();
</script>
