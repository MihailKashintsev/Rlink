name: Release

# Builds signed Android (AAB + APK), macOS and Windows on a v*.*.* tag and
# publishes them to the PUBLIC repo MihailKashintsev/Rlink-releases.
#
# IMPORTANT: each build job uploads its asset DIRECTLY to the GitHub release
# (release storage is separate from the Actions *artifact* storage quota — that
# quota filled up and made upload-artifact fail on every release, blocking
# publish). No intermediate actions/upload-artifact anywhere. The relay job then
# pulls the finished assets from the public release.
#
# Requires secrets on THIS repo: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD,
# KEY_ALIAS (Android signing), RELEASES_PAT (contents:write on Rlink-releases),
# RELAY_SSH_KEY (optional — relay mirror), TURN_PASSWORD (calls; see below).

on:
  push:
    tags:
      - 'v*.*.*'

# CallService reads TURN over String.fromEnvironment, so a build without these
# ships with no TURN server at all — only public STUN. Every released build was
# in that state, which is why coturn had logged zero allocations: a call that
# can't go peer-to-peer had nothing to fall back to. deploy-gh-pages.yml already
# passed them; release builds must too.
env:
  TURN_HOST: ${{ vars.TURN_HOST || '185.244.172.90' }}
  TURN_USER: ${{ vars.TURN_USER || 'rlink' }}
  TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (AAB + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          # cache disabled: the account's Actions storage quota is over limit,
          # which breaks the cache backend (BlobNotFound) and fails setup. Re-
          # downloading Flutter each run is slower but reliable.
          cache: false
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
      # ubuntu-latest has ~7 GB RAM; the project's android/gradle.properties asks
      # for -Xmx8G which OOMs the Gradle daemon (exit 143). Override just in the
      # runner workspace — the repo file is untouched.
      - name: Tune Gradle memory for CI runner
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF
      - run: flutter pub get
      - name: Build AAB (RuStore)
        run: flutter build appbundle --release \
          --dart-define="TURN_HOST=${TURN_HOST}" \
          --dart-define="TURN_USER=${TURN_USER}" \
          --dart-define="TURN_PASSWORD=${TURN_PASSWORD}"
      # Split per ABI, not a universal APK: the relay is bandwidth-capped
      # (~2 MB/s global), so a smaller file is the only real download speedup.
      # arm64 is ~65 MB vs ~130 MB universal. `android` in the manifest means
      # arm64 (what every client reads by default); 32-bit ARM devices get
      # `android_arm32`.
      - name: Build APK (site)
        run: flutter build apk --release --split-per-abi \
          --dart-define="TURN_HOST=${TURN_HOST}" \
          --dart-define="TURN_USER=${TURN_USER}" \
          --dart-define="TURN_PASSWORD=${TURN_PASSWORD}"
      - name: Rename
        run: |
          V="${{ github.ref_name }}"
          cp build/app/outputs/bundle/release/app-release.aab   rlink_${V}_rustore.aab
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   Rlink-${V}-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk Rlink-${V}-arm32.apk
      - name: Upload to Rlink-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: MihailKashintsev/Rlink-releases
          tag_name: ${{ github.ref_name }}
          name: "Rlink ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.RELEASES_PAT }}
          files: |
            rlink_*_rustore.aab
            Rlink-*.apk
          body: |
            Rlink ${{ github.ref_name }}

            • Android APK: `Rlink-${{ github.ref_name }}-arm64.apk` (установи, разрешив «неизвестные источники»)
            • Android APK для старых 32-битных: `Rlink-${{ github.ref_name }}-arm32.apk`
            • macOS: `rlink_${{ github.ref_name }}_macos.zip`
            • Windows: `rlink_${{ github.ref_name }}_windows.zip`
            • RuStore AAB: `rlink_${{ github.ref_name }}_rustore.aab`

  build-windows:
    name: Build Windows
    # Pin to the stable VS2022 image: windows-latest moved to a preview MSVC
    # (14.51) that hard-errors on <experimental/coroutine> used by several
    # plugins (audioplayers/gal/permission_handler/flutter_local_notifications).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          # cache disabled: the account's Actions storage quota is over limit,
          # which breaks the cache backend (BlobNotFound) and fails setup. Re-
          # downloading Flutter each run is slower but reliable.
          cache: false
      - run: flutter pub get
      # flutter_webrtc's third_party/CMakeLists.txt extracts libwebrtc.zip into a
      # path that runs THROUGH the flutter/ephemeral/.plugin_symlinks/flutter_webrtc
      # symlink, which CMake >=3.28 refuses ("Cannot extract through symlink"). Pre-
      # extract libwebrtc into the REAL pub-cache dir so the CMake guard finds it
      # already present and skips the failing extract.
      - name: Pre-extract libwebrtc (avoid symlink extract failure)
        shell: pwsh
        run: |
          $base = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $plugin = Get-ChildItem "$base\hosted\pub.dev" -Directory -Filter "flutter_webrtc-*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $plugin) { Write-Error "flutter_webrtc not found in pub cache ($base)"; exit 1 }
          $tp = Join-Path $plugin.FullName "third_party"
          $url = Select-String -Path (Join-Path $tp "CMakeLists.txt") -Pattern 'DOWNLOAD_URL "([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1
          if (-not $url) { $url = "https://github.com/flutter-webrtc/flutter-webrtc/releases/download/v1.4.0/libwebrtc.zip" }
          Write-Host "libwebrtc url: $url  ->  $tp"
          if (-not (Test-Path (Join-Path $tp "libwebrtc"))) {
            New-Item -ItemType Directory -Force -Path (Join-Path $tp "downloads") | Out-Null
            $zip = Join-Path $tp "downloads\libwebrtc.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $tp -Force
          }
          Get-ChildItem $tp | Select-Object Name
      # CL env var injects the define into every cl.exe call so plugins that pull
      # <experimental/coroutine> (audioplayers/gal/permission_handler/…) don't hard-error.
      - name: Build
        # bash, not the Windows default pwsh: `${VAR}` and the `\` line
        # continuation below are bash syntax and silently produce empty
        # dart-defines under PowerShell.
        shell: bash
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release \
          --dart-define="TURN_HOST=${TURN_HOST}" \
          --dart-define="TURN_USER=${TURN_USER}" \
          --dart-define="TURN_PASSWORD=${TURN_PASSWORD}"
      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "rlink_${{ github.ref_name }}_windows.zip"
      - name: Upload to Rlink-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: MihailKashintsev/Rlink-releases
          tag_name: ${{ github.ref_name }}
          name: "Rlink ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.RELEASES_PAT }}
          files: rlink_*_windows.zip

  build-macos:
    name: Build macOS
    # NOTE: macOS can fail on a WhisperKit SPM dependency conflict on some Xcode
    # images. It's independent now — a macOS failure never blocks Android/Windows.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          # cache disabled: the account's Actions storage quota is over limit,
          # which breaks the cache backend (BlobNotFound) and fails setup. Re-
          # downloading Flutter each run is slower but reliable.
          cache: false
      - run: flutter pub get
      - name: Build
        run: flutter build macos --release \
          --dart-define="TURN_HOST=${TURN_HOST}" \
          --dart-define="TURN_USER=${TURN_USER}" \
          --dart-define="TURN_PASSWORD=${TURN_PASSWORD}"
      - name: ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/rlink_${{ github.ref_name }}_macos.zip" Rlink.app
      - name: Upload to Rlink-releases
        uses: softprops/action-gh-release@v2
        with:
          repository: MihailKashintsev/Rlink-releases
          tag_name: ${{ github.ref_name }}
          name: "Rlink ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ secrets.RELEASES_PAT }}
          files: rlink_*_macos.zip

  relay:
    name: Publish update to relay (own server)
    needs: [build-android, build-windows, build-macos]
    # Runs as long as Android built; a flaky Windows/macOS or a down relay must
    # not block it. The relay is best-effort (source of truth is the GitHub
    # release) — if it fails, re-sync manually the same way this job does.
    if: ${{ always() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Pull assets from the GitHub release
        env:
          V: ${{ github.ref_name }}
        run: |
          B=https://github.com/MihailKashintsev/Rlink-releases/releases/download/$V
          mkdir -p artifacts && cd artifacts
          for f in "Rlink-$V-arm64.apk" "Rlink-$V-arm32.apk" "rlink_${V}_windows.zip" "rlink_${V}_macos.zip"; do
            if curl -fsSL --retry 6 --retry-delay 3 -o "$f" "$B/$f"; then
              echo "got $f"
            else
              rm -f "$f"; echo "miss $f (build may have failed — will omit)"
            fi
          done
          ls -lah
      - name: Mirror to relay + regenerate manifest
        env:
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          V: ${{ github.ref_name }}
        run: |
          if [ -z "$RELAY_SSH_KEY" ]; then
            echo "RELAY_SSH_KEY not set — skipping relay publish"; exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$RELAY_SSH_KEY" > ~/.ssh/relay && chmod 600 ~/.ssh/relay
          SSHOPTS="-o StrictHostKeyChecking=no -o ConnectTimeout=25 -o ServerAliveInterval=10 -o ServerAliveCountMax=6"
          SSH="ssh -i $HOME/.ssh/relay $SSHOPTS"
          SCP="scp -i $HOME/.ssh/relay $SSHOPTS"
          HOST=root@185.244.172.90
          DIR=/var/www/rlink-updates
          B=https://185.244.172.90.nip.io/updates
          # `android` = arm64: every client, including old ones that predate the
          # split, reads that key. 32-bit ARM picks `android_arm32` when present.
          au=""; [ -f "artifacts/Rlink-${V}-arm64.apk" ]   && au="$B/Rlink-${V}-arm64.apk"
          a32=""; [ -f "artifacts/Rlink-${V}-arm32.apk" ]  && a32="$B/Rlink-${V}-arm32.apk"
          wu=""; [ -f "artifacts/rlink_${V}_windows.zip" ] && wu="$B/rlink_${V}_windows.zip"
          mu=""; [ -f "artifacts/rlink_${V}_macos.zip" ]   && mu="$B/rlink_${V}_macos.zip"
          jq -n --arg v "$V" --arg au "$au" --arg a32 "$a32" --arg wu "$wu" --arg mu "$mu" '{
            version:$v, notes:("Обновление "+$v), publishedAt:(now|todate),
            assets:{android:$au, android_arm32:$a32, windows:$wu, macos:$mu, linux:"", web:$v}
          }' > manifest.json
          $SSH $HOST "mkdir -p $DIR"
          for f in "Rlink-${V}.apk" "rlink_${V}_windows.zip" "rlink_${V}_macos.zip"; do
            if [ -f "artifacts/$f" ]; then $SCP "artifacts/$f" "$HOST:$DIR/$f"; else echo "skip missing $f"; fi
          done
          $SCP manifest.json "$HOST:$DIR/manifest.json"
          # Keep ONLY the current version on the relay (GitHub keeps full history).
          $SSH $HOST "cd $DIR && for f in Rlink-*.apk rlink_*_windows.zip rlink_*_macos.zip rlink_*_linux.tar.gz; do [ -e \"\$f\" ] || continue; case \"\$f\" in Rlink-${V}-arm64.apk|Rlink-${V}-arm32.apk|rlink_${V}_windows.zip|rlink_${V}_macos.zip|rlink_${V}_linux.tar.gz) : ;; *) rm -f \"\$f\" && echo \"removed old \$f\" ;; esac; done && chmod -R 755 $DIR && ls -lah $DIR"
          echo "relay update published: $V"
