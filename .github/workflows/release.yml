name: Release

# Builds signed Android (AAB + APK), macOS and Windows on a v*.*.* tag and
# publishes them as ONE release to the PUBLIC repo MihailKashintsev/Rlink-releases
# (the private source repo Rlink never gets release artifacts).
#
# The desktop in-app updater (lib/services/update_service.dart) reads that public
# repo by default and matches assets ending in _macos.zip / _windows.zip, so it
# needs NO token baked into the binary — we intentionally do not pass GITHUB_PAT.
#
# Requires secrets on THIS repo: KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_PASSWORD,
# KEY_ALIAS (Android signing) and RELEASES_PAT (contents:write on Rlink-releases).

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android (AAB + APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true
      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/keystore.jks
      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keystore.jks
          EOF
      # ubuntu-latest has ~7 GB RAM; the project's android/gradle.properties asks
      # for -Xmx8G which OOMs the Gradle daemon (exit 143). Override just in the
      # runner workspace — the repo file is untouched.
      - name: Tune Gradle memory for CI runner
        run: |
          cat > android/gradle.properties << 'EOF'
          org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=384m -XX:+HeapDumpOnOutOfMemoryError
          android.useAndroidX=true
          org.gradle.daemon=false
          org.gradle.parallel=false
          org.gradle.workers.max=2
          EOF
      - run: flutter pub get
      - name: Build AAB (RuStore)
        run: flutter build appbundle --release
      - name: Build APK (site)
        run: flutter build apk --release
      - name: Rename
        run: |
          V="${{ github.ref_name }}"
          cp build/app/outputs/bundle/release/app-release.aab   rlink_${V}_rustore.aab
          cp build/app/outputs/flutter-apk/app-release.apk      Rlink-${V}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            rlink_*_rustore.aab
            Rlink-*.apk

  build-windows:
    name: Build Windows
    # Pin to the stable VS2022 image: windows-latest moved to a preview MSVC
    # (14.51) that hard-errors on <experimental/coroutine> used by several
    # plugins (audioplayers/gal/permission_handler/flutter_local_notifications).
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      # flutter_webrtc's third_party/CMakeLists.txt extracts libwebrtc.zip into a
      # path that runs THROUGH the flutter/ephemeral/.plugin_symlinks/flutter_webrtc
      # symlink, which CMake >=3.28 refuses ("Cannot extract through symlink"). Pre-
      # extract libwebrtc into the REAL pub-cache dir so the CMake guard finds it
      # already present and skips the failing extract.
      - name: Pre-extract libwebrtc (avoid symlink extract failure)
        shell: pwsh
        run: |
          $base = if ($env:PUB_CACHE) { $env:PUB_CACHE } else { "$env:LOCALAPPDATA\Pub\Cache" }
          $plugin = Get-ChildItem "$base\hosted\pub.dev" -Directory -Filter "flutter_webrtc-*" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $plugin) { Write-Error "flutter_webrtc not found in pub cache ($base)"; exit 1 }
          $tp = Join-Path $plugin.FullName "third_party"
          $url = Select-String -Path (Join-Path $tp "CMakeLists.txt") -Pattern 'DOWNLOAD_URL "([^"]+)"' | ForEach-Object { $_.Matches[0].Groups[1].Value } | Select-Object -First 1
          if (-not $url) { $url = "https://github.com/flutter-webrtc/flutter-webrtc/releases/download/v1.4.0/libwebrtc.zip" }
          Write-Host "libwebrtc url: $url  ->  $tp"
          if (-not (Test-Path (Join-Path $tp "libwebrtc"))) {
            New-Item -ItemType Directory -Force -Path (Join-Path $tp "downloads") | Out-Null
            $zip = Join-Path $tp "downloads\libwebrtc.zip"
            Invoke-WebRequest -Uri $url -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $tp -Force
          }
          Get-ChildItem $tp | Select-Object Name
      # No GITHUB_* dart-defines: the updater defaults to the public Rlink-releases
      # repo and reads it anonymously, so no write-capable token is baked in.
      # CL env var injects the define into every cl.exe call so plugins that pull
      # <experimental/coroutine> (audioplayers/gal/permission_handler/…) don't hard-error.
      - name: Build
        env:
          CL: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release
      - name: ZIP
        shell: pwsh
        run: Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "rlink_${{ github.ref_name }}_windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: rlink_*_windows.zip

  build-macos:
    name: Build macOS
    # NOTE: macOS currently fails on a WhisperKit SPM dependency conflict —
    # macos-latest (Xcode 16/Swift 6) resolves swift-transformers 1.1.9 but it
    # won't compile (Config.swift ObjectKey), while macos-14 (Xcode 15) can't
    # even resolve (swift-jinja 2.0 needs swift-tools 6.0). Needs a dedicated fix
    # (pin a Swift-6-clean swift-transformers / bump WhisperKit). Kept on
    # macos-latest as the more tractable base. Publish still ships Android+Windows.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.5'
          channel: 'stable'
          cache: true
      - run: flutter pub get
      - name: Build
        run: flutter build macos --release
      - name: ZIP
        run: |
          cd build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/rlink_${{ github.ref_name }}_macos.zip" Rlink.app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: rlink_*_macos.zip

  publish:
    name: Publish to Rlink-releases
    needs: [build-android, build-windows, build-macos]
    # Publish as long as Android succeeded; don't let a flaky Windows toolchain
    # hold the whole release hostage. macOS/Windows are included only if their
    # jobs produced artifacts.
    if: ${{ always() && needs.build-android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts/
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          repository: MihailKashintsev/Rlink-releases
          tag_name: ${{ github.ref_name }}
          name: "Rlink ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
          token: ${{ secrets.RELEASES_PAT }}
          body: |
            Rlink ${{ github.ref_name }}

            • Android APK: `Rlink-${{ github.ref_name }}.apk` (установи, разрешив «неизвестные источники»)
            • macOS: `rlink_${{ github.ref_name }}_macos.zip`
            • Windows: `rlink_${{ github.ref_name }}_windows.zip`
            • RuStore AAB: `rlink_${{ github.ref_name }}_rustore.aab`

      # Mirror the update to our OWN server (relay) so the in-app auto-updater
      # doesn't depend on GitHub (throttled/blocked in RU). Uploads the binaries
      # + regenerates the manifest the app polls. No-ops if the secret is absent.
      - name: Publish update to relay (own server)
        env:
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          V: ${{ github.ref_name }}
        run: |
          if [ -z "$RELAY_SSH_KEY" ]; then
            echo "RELAY_SSH_KEY not set — skipping relay publish"; exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$RELAY_SSH_KEY" > ~/.ssh/relay && chmod 600 ~/.ssh/relay
          SSH="ssh -i $HOME/.ssh/relay -o StrictHostKeyChecking=no -o ConnectTimeout=25"
          SCP="scp -i $HOME/.ssh/relay -o StrictHostKeyChecking=no -o ConnectTimeout=25"
          HOST=root@185.244.172.90
          DIR=/var/www/rlink-updates
          B=https://185.244.172.90.nip.io/updates
          # Only list a platform if its artifact actually built — otherwise the
          # site/updater would point at a file that was never uploaded.
          au=""; [ -f "artifacts/Rlink-${V}.apk" ]        && au="$B/Rlink-${V}.apk"
          wu=""; [ -f "artifacts/rlink_${V}_windows.zip" ] && wu="$B/rlink_${V}_windows.zip"
          mu=""; [ -f "artifacts/rlink_${V}_macos.zip" ]   && mu="$B/rlink_${V}_macos.zip"
          jq -n --arg v "$V" --arg au "$au" --arg wu "$wu" --arg mu "$mu" '{
            version:$v, notes:("Обновление "+$v), publishedAt:(now|todate),
            assets:{android:$au, windows:$wu, macos:$mu, linux:"", web:$v}
          }' > manifest.json
          $SSH $HOST "mkdir -p $DIR"
          for f in "Rlink-${V}.apk" "rlink_${V}_windows.zip" "rlink_${V}_macos.zip"; do
            if [ -f "artifacts/$f" ]; then $SCP "artifacts/$f" "$HOST:$DIR/$f"; else echo "skip missing $f"; fi
          done
          $SCP manifest.json "$HOST:$DIR/manifest.json"
          # Keep ONLY the current version on the relay: delete every older build
          # so updates don't pile up and eat disk. GitHub Rlink-releases still
          # keeps the full version history.
          $SSH $HOST "cd $DIR && for f in Rlink-*.apk rlink_*_windows.zip rlink_*_macos.zip rlink_*_linux.tar.gz; do [ -e \"\$f\" ] || continue; case \"\$f\" in Rlink-${V}.apk|rlink_${V}_windows.zip|rlink_${V}_macos.zip|rlink_${V}_linux.tar.gz) : ;; *) rm -f \"\$f\" && echo \"removed old \$f\" ;; esac; done && chmod -R 755 $DIR && ls -lah $DIR"
          echo "relay update published: $V"
