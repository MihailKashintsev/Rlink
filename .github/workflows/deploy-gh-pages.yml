name: Deploy Web to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # This same workflow file lives in both repos; only rlink-web has Pages
    # enabled. Skip on the source repo (MihailKashintsev/Rlink) so it doesn't
    # fail on every push — the real deploy runs when we push to rlink-web.
    if: ${{ github.repository == 'MihailKashintsev/rlink-web' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build web
        env:
          # TURN media relay — required for calls between symmetric-NAT / mobile
          # networks (без него сигналинг проходит, а звук/видео не доходят).
          # Host/user default to the known relay; password must be set as a repo
          # secret (coturn turnserver.conf: user=rlink:<password>). If the secret
          # is empty, TURN stays disabled (CallService falls back to STUN only).
          TURN_HOST: ${{ vars.TURN_HOST || '185.244.172.90' }}
          TURN_USER: ${{ vars.TURN_USER || 'rlink' }}
          # NO hardcoded fallback — the password must come from the repo secret.
          # If the secret is unset, TURN stays disabled (calls fall back to STUN).
          TURN_PASSWORD: ${{ secrets.TURN_PASSWORD }}
        run: |
          short_sha="${GITHUB_SHA::7}"
          flutter build web --release \
            --pwa-strategy=none \
            --base-href "/${{ github.event.repository.name }}/" \
            --dart-define="RLINK_WEB_PUSH_ID=${GITHUB_RUN_NUMBER}-${short_sha}" \
            --dart-define="TURN_HOST=${TURN_HOST}" \
            --dart-define="TURN_USER=${TURN_USER}" \
            --dart-define="TURN_PASSWORD=${TURN_PASSWORD}"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
