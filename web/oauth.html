<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rlink — привязка Google Drive</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0b1220; color: #f1f5f9; padding: 20px;
  }
  .card {
    width: 100%; max-width: 460px; background: #111a2b;
    border: 1px solid #1f2937; border-radius: 18px; padding: 24px;
  }
  h1 { font-size: 1.2rem; margin: 0 0 6px; }
  p { color: #94a3b8; font-size: 0.92rem; line-height: 1.5; margin: 0 0 16px; }
  textarea {
    width: 100%; min-height: 96px; resize: vertical;
    background: #0b1220; color: #14b8a6; border: 1px solid #1f2937;
    border-radius: 10px; padding: 12px; font-family: ui-monospace, monospace;
    font-size: 0.8rem; word-break: break-all;
  }
  button {
    width: 100%; margin-top: 14px; padding: 14px; border: none;
    border-radius: 12px; background: #0d9488; color: #fff;
    font-size: 1rem; font-weight: 600; cursor: pointer;
  }
  button:active { opacity: 0.9; }
  .ok { color: #34d399; font-weight: 600; margin-top: 12px; display: none; }
  .err { color: #f87171; }
</style>
</head>
<body>
  <div class="card">
    <h1>Код доступа к Google Drive</h1>
    <p id="hint">Скопируйте код ниже, вернитесь в приложение Rlink и вставьте его в поле «Привязать Google Drive».</p>
    <textarea id="token" readonly></textarea>
    <button id="copy">Скопировать код</button>
    <div class="ok" id="ok">Скопировано ✓ Вернитесь в приложение Rlink.</div>
  </div>
<script>
  (function () {
    function parseHash() {
      var h = (window.location.hash || '').replace(/^#/, '');
      var out = {};
      h.split('&').forEach(function (pair) {
        var kv = pair.split('=');
        if (kv[0]) out[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
      });
      return out;
    }
    var q = parseHash();
    var ta = document.getElementById('token');
    var hint = document.getElementById('hint');
    var ok = document.getElementById('ok');
    if (q.access_token) {
      // Package token + expiry so the app can set the right lifetime.
      ta.value = q.access_token + '|' + (q.expires_in || '3600');
    } else if (q.error) {
      hint.className = 'err';
      hint.textContent = 'Google вернул ошибку: ' + q.error + '. Попробуйте ещё раз.';
      ta.value = '';
    } else {
      hint.textContent = 'Откройте эту страницу по ссылке входа из приложения Rlink.';
      ta.value = '';
    }
    document.getElementById('copy').addEventListener('click', function () {
      if (!ta.value) return;
      ta.select();
      try {
        navigator.clipboard.writeText(ta.value);
      } catch (e) {
        document.execCommand('copy');
      }
      ok.style.display = 'block';
    });
  })();
</script>
</body>
</html>
