<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">
  <meta name="google-signin-client_id" content="180782636430-cr0ogo622n3ng26aeu00j0pkn4286dvs.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="rlink">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260427">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20260427"/>
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png?v=20260427"/>
  <link rel="shortcut icon" href="favicon.png?v=20260427"/>

  <title>rlink</title>
  <link rel="manifest" href="manifest.json?v=20260427">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    async function _rlinkClearStaleFlutterWorker() {
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          await Promise.all(registrations.map(async (registration) => {
            const worker = registration.active || registration.waiting || registration.installing;
            const scriptUrl = worker && worker.scriptURL ? worker.scriptURL : '';
            if (scriptUrl.includes('flutter_service_worker.js')) {
              await registration.unregister();
            }
          }));
        }
        if ('caches' in window) {
          const keys = await caches.keys();
          await Promise.all(keys.map((key) => {
            if (
              key.startsWith('flutter-app-cache') ||
              key.startsWith('flutter-temp-cache') ||
              key.startsWith('flutter-app-manifest')
            ) {
              return caches.delete(key);
            }
            return Promise.resolve(false);
          }));
        }
      } catch (_) {}
    }

    // Bump on every deploy that changes Dart code — busts the cached bootstrap
    // AND main.dart.js (see web/flutter_bootstrap.js).
    window.__rlinkBuildV = '20260625-60';
    function _rlinkLoadFlutter() {
      const script = document.createElement('script');
      script.src = 'flutter_bootstrap.js?v=' + window.__rlinkBuildV;
      script.async = true;
      document.body.appendChild(script);
    }

    function _rlinkHttpBase(relayUrl) {
      const raw = (relayUrl || '').trim();
      if (!raw) return '';
      if (raw.startsWith('wss://')) return raw.replace('wss://', 'https://');
      if (raw.startsWith('ws://')) return raw.replace('ws://', 'http://');
      return raw;
    }

    function _rlinkB64ToU8(base64Url) {
      const s = (base64Url || '').replace(/-/g, '+').replace(/_/g, '/');
      const pad = '='.repeat((4 - (s.length % 4)) % 4);
      const bin = atob(s + pad);
      const out = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
      return out;
    }

    function _rlinkU8ToB64Url(bytes) {
      let bin = '';
      for (let i = 0; i < bytes.length; i++) bin += String.fromCharCode(bytes[i]);
      return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    window.rlinkSyncPushSubscription = async function(relayUrl, publicKey, nick) {
      try {
        if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
        if (!('Notification' in window)) return;
        const relayBase = _rlinkHttpBase(relayUrl);
        const me = (publicKey || '').trim().toLowerCase();
        if (!relayBase || !/^[0-9a-f]{64}$/.test(me)) return;
        const syncKey = `${relayBase}|${me}`;
        const now = Date.now();
        window.__rlinkPushSync = window.__rlinkPushSync || { key: '', at: 0, failedAt: 0 };
        // In-flight guard: a flaky WebSocket fires this on every reconnect; without
        // this, many concurrent calls all POST /push/subscribe before any completes,
        // flooding the console with repeated 400s.
        if (window.__rlinkPushSync.inFlight) return;
        let persistedFailedAt = 0;
        try {
          persistedFailedAt = Number(localStorage.getItem(`rlink_push_failed_${syncKey}`) || '0') || 0;
        } catch (_) {}
        if (window.__rlinkPushSync.key === syncKey && now - window.__rlinkPushSync.at < 10 * 60 * 1000) return;
        if (window.__rlinkPushSync.key === syncKey && now - window.__rlinkPushSync.failedAt < 60 * 60 * 1000) return;
        if (persistedFailedAt > 0 && now - persistedFailedAt < 60 * 60 * 1000) return;
        window.__rlinkPushSync.key = syncKey;
        window.__rlinkPushSync.at = now;
        window.__rlinkPushSync.inFlight = true;

        const keyResp = await fetch(`${relayBase}/push/public_key`, { method: 'GET' });
        if (!keyResp.ok) {
          window.__rlinkPushSync.failedAt = Date.now();
          return;
        }
        const keyJson = await keyResp.json();
        const vapid = (keyJson && keyJson.publicKey) ? String(keyJson.publicKey).trim() : '';
        if (!vapid) return;

        if (Notification.permission !== 'granted') return;

        const reg = await navigator.serviceWorker.register('push_sw.js');
        let sub = await reg.pushManager.getSubscription();
        if (!sub) {
          sub = await reg.pushManager.subscribe({
            userVisibleOnly: true,
            applicationServerKey: _rlinkB64ToU8(vapid),
          });
        }
        if (!sub) return;
        const p256 = sub.getKey('p256dh');
        const auth = sub.getKey('auth');
        if (!p256 || !auth) return;
        const subscribeResp = await fetch(`${relayBase}/push/subscribe`, {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({
            publicKey: me,
            nick: nick || '',
            subscription: {
              endpoint: sub.endpoint,
              keys: {
                p256dh: _rlinkU8ToB64Url(new Uint8Array(p256)),
                auth: _rlinkU8ToB64Url(new Uint8Array(auth)),
              },
            },
          }),
        });
        if (!subscribeResp.ok) {
          window.__rlinkPushSync.failedAt = Date.now();
          if (subscribeResp.status >= 400 && subscribeResp.status < 500) {
            try {
              localStorage.setItem(`rlink_push_failed_${syncKey}`, String(window.__rlinkPushSync.failedAt));
            } catch (_) {}
          }
        } else {
          try {
            localStorage.removeItem(`rlink_push_failed_${syncKey}`);
          } catch (_) {}
        }
      } catch (_) {} finally {
        if (window.__rlinkPushSync) window.__rlinkPushSync.inFlight = false;
      }
    };
  </script>
  <script src="whisper_web.js" defer></script>
  <script>
    _rlinkClearStaleFlutterWorker().finally(_rlinkLoadFlutter);
  </script>
</body>
</html>
